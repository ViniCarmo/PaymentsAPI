spring:
  application:
    name: payments-api
  datasource:
    url: jdbc:postgresql://localhost:5433/payments-api
    username: postgres
    password: admin
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration


